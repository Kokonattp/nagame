<!doctype html>
<!-- Tabi collectibles — omamori (お守り) and manhole covers — modelled in three.js and rendered to
     WebP by render.cjs. All motifs are original drawings of generic symbols; nothing is copied
     from real covers, マンホールカード or shrine charms.
     render.cjs injects window.__design before load; ?kind=omamori|manhole. -->
<html>
<head>
  <meta charset="utf-8" />
  <style>
    html, body { margin: 0; background: transparent; } canvas { display: block; }
    /* OFL fonts fetched by render.cjs into ./fonts (not committed) */
    @font-face { font-family: "Yuji Syuku"; src: url("fonts/YujiSyuku-Regular.ttf"); }
    @font-face { font-family: "Shippori Mincho"; font-weight: 800; src: url("fonts/ShipporiMincho-ExtraBold.ttf"); }
  </style>
  <script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { RoomEnvironment } from "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/environments/RoomEnvironment.js";

const params = new URLSearchParams(location.search);
const kind = params.get("kind") ?? "manhole";
const W = Number(params.get("w") ?? 512), H = Number(params.get("h") ?? 512);
const D = window.__design;
const MINCHO = '"Shippori Mincho", "Yu Mincho", serif'; // ring lettering on the covers
const BRUSH = '"Yuji Syuku", "Shippori Mincho", serif'; // embroidered calligraphy on the charms

// deterministic noise so re-renders are identical
let seed = [...JSON.stringify(D)].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7);
const rand = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

/** Smooth value noise (0..1) as a Float32Array N×N: random cells scaled up with smoothing, two octaves. */
function smoothNoise(N, cells) {
  const [c, x] = canvas(N, N);
  x.imageSmoothingEnabled = true; x.imageSmoothingQuality = "high";
  for (const [n, a] of [[cells, 0.65], [cells * 4, 0.35]]) {
    const [sc, s] = canvas(n, n); const d = s.createImageData(n, n);
    for (let i = 0; i < d.data.length; i += 4) { d.data[i] = d.data[i + 1] = d.data[i + 2] = rand() * 255; d.data[i + 3] = 255; }
    s.putImageData(d, 0, 0); x.globalAlpha = a; x.drawImage(sc, 0, 0, N, N);
  }
  const px = x.getImageData(0, 0, N, N).data, out = new Float32Array(N * N);
  for (let i = 0; i < out.length; i++) out[i] = px[i * 4] / 255;
  return out;
}
function canvas(w, h) { const c = document.createElement("canvas"); c.width = w; c.height = h; return [c, c.getContext("2d")]; }
function tex(c, color = false) {
  const t = new THREE.CanvasTexture(c);
  if (color) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}

/* ───────────── motifs: filled shapes centred on 0,0 with size s (≈ radius) ─────────────
   Each returns nothing; it fills (and for line motifs, strokes) with the current style.
   `lines(ctx, s)` adds the engraved inner detail (drawn as grooves on the height map). */
const P = Math.PI;
function petal(ctx, s, notch = true) {
  ctx.moveTo(0, 0);
  ctx.bezierCurveTo(s * 0.42, -s * 0.25, s * 0.38, -s * 0.85, notch ? s * 0.12 : 0, -s);
  if (notch) { ctx.lineTo(0, -s * 0.86); ctx.lineTo(-s * 0.12, -s); }
  ctx.bezierCurveTo(-s * 0.38, -s * 0.85, -s * 0.42, -s * 0.25, 0, 0);
}
const MOTIF = {
  sakura(ctx, s) { ctx.beginPath(); for (let k = 0; k < 5; k++) { ctx.save(); ctx.rotate((k * 2 * P) / 5); petal(ctx, s); ctx.restore(); } ctx.fill(); },
  plum(ctx, s) { ctx.beginPath(); for (let k = 0; k < 5; k++) { const a = (k * 2 * P) / 5 - P / 2; ctx.moveTo(Math.cos(a) * s * 0.55 + s * 0.42, Math.sin(a) * s * 0.55); ctx.arc(Math.cos(a) * s * 0.55, Math.sin(a) * s * 0.55, s * 0.42, 0, 2 * P); } ctx.fill(); },
  hibiscus(ctx, s) { ctx.beginPath(); for (let k = 0; k < 5; k++) { ctx.save(); ctx.rotate((k * 2 * P) / 5); ctx.moveTo(0, 0); ctx.bezierCurveTo(s * 0.7, -s * 0.2, s * 0.6, -s * 1.05, 0, -s * 0.98); ctx.bezierCurveTo(-s * 0.6, -s * 1.05, -s * 0.7, -s * 0.2, 0, 0); ctx.restore(); } ctx.fill(); },
  maple(ctx, s) {
    const lobes = [1, 0.78, 0.6, 0.42, 0.42, 0.6, 0.78];
    ctx.beginPath();
    for (let i = 0; i < 7; i++) {
      const a = -P / 2 + (i - 3) * 0.48 + (i > 3 ? 0 : 0), r = s * lobes[(i + 4) % 7] * 1.0;
      const tipA = -P / 2 + (i - 3) * (P / 3.6);
      const len = s * [0.55, 0.75, 0.9, 1, 0.9, 0.75, 0.55][i];
      const l = tipA - 0.22, rr = tipA + 0.22;
      if (i === 0) ctx.moveTo(Math.cos(l) * len * 0.35, Math.sin(l) * len * 0.35);
      ctx.lineTo(Math.cos(l) * len * 0.62, Math.sin(l) * len * 0.62);
      ctx.lineTo(Math.cos(tipA - 0.12) * len * 0.82, Math.sin(tipA - 0.12) * len * 0.82);
      ctx.lineTo(Math.cos(tipA) * len, Math.sin(tipA) * len);
      ctx.lineTo(Math.cos(tipA + 0.12) * len * 0.82, Math.sin(tipA + 0.12) * len * 0.82);
      ctx.lineTo(Math.cos(rr) * len * 0.62, Math.sin(rr) * len * 0.62);
      ctx.lineTo(Math.cos(rr + 0.1) * s * 0.3, Math.sin(rr + 0.1) * s * 0.3);
      void a; void r;
    }
    ctx.closePath(); ctx.fill();
    ctx.fillRect(-s * 0.04, 0, s * 0.08, s * 0.55);
  },
  ginkgo(ctx, s) {
    ctx.beginPath(); ctx.moveTo(0, s * 0.35);
    ctx.lineTo(Math.cos(-P * 0.85) * s, Math.sin(-P * 0.85) * s + s * 0.25);
    for (let i = 0; i <= 24; i++) { const a = -P * 0.85 + (i / 24) * P * 0.7; const wob = 1 + 0.03 * Math.sin(i * 2.2) - (Math.abs(i - 12) < 1.5 ? 0.12 : 0); ctx.lineTo(Math.cos(a) * s * wob, Math.sin(a) * s * wob + s * 0.25); }
    ctx.closePath(); ctx.fill(); ctx.fillRect(-s * 0.035, s * 0.3, s * 0.07, s * 0.6);
  },
  snowflake(ctx, s) {
    ctx.save(); ctx.lineCap = "round"; ctx.strokeStyle = ctx.fillStyle; ctx.lineWidth = s * 0.13;
    for (let k = 0; k < 6; k++) { ctx.save(); ctx.rotate((k * P) / 3); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -s);
      for (const t of [0.45, 0.72]) { ctx.moveTo(0, -s * t); ctx.lineTo(s * 0.26, -s * (t + 0.2)); ctx.moveTo(0, -s * t); ctx.lineTo(-s * 0.26, -s * (t + 0.2)); }
      ctx.stroke(); ctx.restore(); }
    ctx.restore();
  },
  fuji(ctx, s) { ctx.beginPath(); ctx.moveTo(-s, s * 0.55); ctx.bezierCurveTo(-s * 0.55, s * 0.2, -s * 0.3, -s * 0.45, -s * 0.18, -s * 0.6); ctx.lineTo(s * 0.18, -s * 0.6); ctx.bezierCurveTo(s * 0.3, -s * 0.45, s * 0.55, s * 0.2, s, s * 0.55); ctx.closePath(); ctx.fill(); },
  volcano(ctx, s) { MOTIF.fuji(ctx, s); ctx.beginPath(); for (const [x, y, r] of [[0, -0.78, 0.16], [0.18, -0.95, 0.2], [0.42, -1.05, 0.17]]) { ctx.moveTo(s * (x + r), s * y); ctx.arc(s * x, s * y, s * r, 0, 2 * P); } ctx.fill(); },
  pagoda(ctx, s) {
    ctx.beginPath();
    for (let i = 0; i < 5; i++) { const y = s * (0.62 - i * 0.3), w = s * (0.82 - i * 0.1); ctx.moveTo(-w, y); ctx.quadraticCurveTo(-w * 0.55, y - s * 0.12, -w * 0.32, y - s * 0.14); ctx.lineTo(w * 0.32, y - s * 0.14); ctx.quadraticCurveTo(w * 0.55, y - s * 0.12, w, y); ctx.lineTo(w * 0.5, y + s * 0.03); ctx.lineTo(w * 0.5, y + s * 0.15); ctx.lineTo(-w * 0.5, y + s * 0.15); ctx.lineTo(-w * 0.5, y + s * 0.03); ctx.closePath(); }
    ctx.rect(-s * 0.03, -s * 1.02, s * 0.06, s * 0.4); ctx.rect(-s * 0.55, s * 0.76, s * 1.1, s * 0.14);
    ctx.fill();
  },
  castle(ctx, s, paint) {
    const roof = paint?.roof;
    ctx.beginPath(); ctx.moveTo(-s * 0.85, s * 0.9); ctx.lineTo(-s * 0.7, s * 0.45); ctx.lineTo(s * 0.7, s * 0.45); ctx.lineTo(s * 0.85, s * 0.9); ctx.closePath(); ctx.fill();
    const tiers = [[0.62, 0.45, 0.62], [0.48, 0.1, 0.5], [0.34, -0.22, 0.38], [0.22, -0.52, 0.28]];
    for (const [w, y] of tiers) { ctx.fillRect(-s * w * 0.8, s * y - s * 0.02, s * w * 1.6, s * 0.2); }
    const base = ctx.fillStyle; if (roof) ctx.fillStyle = roof;
    ctx.beginPath();
    for (const [w, y] of tiers) { ctx.moveTo(-s * (w + 0.14), s * y); ctx.quadraticCurveTo(-s * w * 0.6, s * y - s * 0.08, -s * w * 0.4, s * y - s * 0.16); ctx.lineTo(s * w * 0.4, s * y - s * 0.16); ctx.quadraticCurveTo(s * w * 0.6, s * y - s * 0.08, s * (w + 0.14), s * y); ctx.closePath(); ctx.moveTo(-s * 0.12, s * y - s * 0.12); ctx.lineTo(0, s * y - s * 0.26); ctx.lineTo(s * 0.12, s * y - s * 0.12); }
    ctx.fill(); ctx.fillStyle = base;
  },
  torii(ctx, s) {
    ctx.beginPath(); ctx.moveTo(-s, -s * 0.62); ctx.quadraticCurveTo(0, -s * 0.48, s, -s * 0.62); ctx.lineTo(s * 0.92, -s * 0.46); ctx.quadraticCurveTo(0, -s * 0.34, -s * 0.92, -s * 0.46); ctx.closePath();
    ctx.rect(-s * 0.78, -s * 0.24, s * 1.56, s * 0.12); ctx.rect(-s * 0.06, -s * 0.38, s * 0.12, s * 0.16);
    ctx.moveTo(-s * 0.62, -s * 0.42); ctx.lineTo(-s * 0.5, -s * 0.42); ctx.lineTo(-s * 0.44, s * 0.95); ctx.lineTo(-s * 0.6, s * 0.95); ctx.closePath();
    ctx.moveTo(s * 0.62, -s * 0.42); ctx.lineTo(s * 0.5, -s * 0.42); ctx.lineTo(s * 0.44, s * 0.95); ctx.lineTo(s * 0.6, s * 0.95); ctx.closePath();
    ctx.fill();
  },
  deer(ctx, s) {
    ctx.beginPath(); ctx.ellipse(-s * 0.05, s * 0.1, s * 0.55, s * 0.28, -0.05, 0, 2 * P);
    ctx.moveTo(s * 0.32, -s * 0.05); ctx.lineTo(s * 0.5, -s * 0.55); ctx.lineTo(s * 0.66, -s * 0.5); ctx.lineTo(s * 0.5, s * 0.05); ctx.closePath();
    ctx.ellipse(s * 0.62, -s * 0.58, s * 0.18, s * 0.11, 0.35, 0, 2 * P);
    for (const x of [-0.45, -0.28, 0.2, 0.36]) ctx.rect(s * x, s * 0.25, s * 0.08, s * 0.65);
    ctx.fill();
    ctx.save(); ctx.strokeStyle = ctx.fillStyle; ctx.lineWidth = s * 0.05; ctx.lineCap = "round"; ctx.beginPath();
    ctx.moveTo(s * 0.56, -s * 0.66); ctx.lineTo(s * 0.45, -s * 0.98); ctx.moveTo(s * 0.5, -s * 0.84); ctx.lineTo(s * 0.36, -s * 0.9);
    ctx.moveTo(s * 0.62, -s * 0.68); ctx.lineTo(s * 0.7, -s * 1.0); ctx.moveTo(s * 0.67, -s * 0.86); ctx.lineTo(s * 0.82, -s * 0.92); ctx.stroke(); ctx.restore();
  },
  crane(ctx, s) {
    ctx.beginPath(); ctx.ellipse(0, s * 0.2, s * 0.45, s * 0.22, 0.15, 0, 2 * P);
    ctx.moveTo(-s * 0.2, s * 0.05); ctx.quadraticCurveTo(-s * 0.7, -s * 0.6, -s * 1.0, -s * 0.5); ctx.quadraticCurveTo(-s * 0.55, -s * 0.15, -s * 0.1, s * 0.2);
    ctx.moveTo(s * 0.1, s * 0.05); ctx.quadraticCurveTo(s * 0.4, -s * 0.7, s * 0.85, -s * 0.85); ctx.quadraticCurveTo(s * 0.55, -s * 0.2, s * 0.25, s * 0.2);
    ctx.fill();
    ctx.save(); ctx.strokeStyle = ctx.fillStyle; ctx.lineCap = "round"; ctx.lineWidth = s * 0.07; ctx.beginPath();
    ctx.moveTo(s * 0.35, s * 0.15); ctx.quadraticCurveTo(s * 0.75, s * 0.05, s * 0.8, -s * 0.25); ctx.lineTo(s * 0.98, -s * 0.2);
    ctx.moveTo(-s * 0.3, s * 0.38); ctx.lineTo(-s * 0.7, s * 0.6); ctx.stroke(); ctx.restore();
  },
  koi(ctx, s) {
    ctx.beginPath(); ctx.moveTo(-s * 0.9, 0); ctx.bezierCurveTo(-s * 0.5, -s * 0.5, s * 0.4, -s * 0.45, s * 0.6, 0); ctx.bezierCurveTo(s * 0.4, s * 0.45, -s * 0.5, s * 0.5, -s * 0.9, 0);
    ctx.moveTo(s * 0.5, 0); ctx.lineTo(s * 1.0, -s * 0.42); ctx.quadraticCurveTo(s * 0.85, 0, s * 1.0, s * 0.42); ctx.closePath();
    ctx.moveTo(-s * 0.1, -s * 0.32); ctx.lineTo(s * 0.15, -s * 0.62); ctx.lineTo(s * 0.25, -s * 0.3); ctx.closePath(); ctx.fill();
  },
  clocktower(ctx, s, paint) {
    ctx.fillRect(-s * 0.7, s * 0.05, s * 1.4, s * 0.85); ctx.fillRect(-s * 0.26, -s * 0.6, s * 0.52, s * 0.7);
    const base = ctx.fillStyle; if (paint?.roof) ctx.fillStyle = paint.roof;
    ctx.beginPath(); ctx.moveTo(-s * 0.85, s * 0.08); ctx.lineTo(0, -s * 0.18); ctx.lineTo(s * 0.85, s * 0.08); ctx.closePath();
    ctx.moveTo(-s * 0.34, -s * 0.58); ctx.lineTo(0, -s * 1.0); ctx.lineTo(s * 0.34, -s * 0.58); ctx.closePath(); ctx.fill(); ctx.fillStyle = base;
  },
  radiotower(ctx, s) {
    ctx.beginPath(); ctx.moveTo(-s * 0.6, s * 0.95); ctx.quadraticCurveTo(-s * 0.18, s * 0.1, -s * 0.06, -s * 0.75); ctx.lineTo(-s * 0.02, -s * 1.02); ctx.lineTo(s * 0.02, -s * 1.02); ctx.lineTo(s * 0.06, -s * 0.75); ctx.quadraticCurveTo(s * 0.18, s * 0.1, s * 0.6, s * 0.95);
    ctx.lineTo(s * 0.4, s * 0.95); ctx.quadraticCurveTo(0, s * 0.45, -s * 0.4, s * 0.95); ctx.closePath(); ctx.fill();
    ctx.fillRect(-s * 0.3, -s * 0.05, s * 0.6, s * 0.12); ctx.fillRect(-s * 0.18, -s * 0.48, s * 0.36, s * 0.1);
  },
  star5(ctx, s) { ctx.beginPath(); for (let i = 0; i < 10; i++) { const a = -P / 2 + (i * P) / 5, r = i % 2 ? s * 0.45 : s; ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r); } ctx.closePath(); ctx.fill(); },
  anchor(ctx, s) {
    ctx.save(); ctx.strokeStyle = ctx.fillStyle; ctx.lineCap = "round"; ctx.lineWidth = s * 0.15; ctx.beginPath();
    ctx.moveTo(0, -s * 0.6); ctx.lineTo(0, s * 0.85); ctx.moveTo(-s * 0.4, -s * 0.38); ctx.lineTo(s * 0.4, -s * 0.38);
    ctx.moveTo(-s * 0.75, s * 0.35); ctx.quadraticCurveTo(-s * 0.6, s * 0.95, 0, s * 0.88); ctx.quadraticCurveTo(s * 0.6, s * 0.95, s * 0.75, s * 0.35); ctx.stroke();
    ctx.lineWidth = s * 0.12; ctx.beginPath(); ctx.arc(0, -s * 0.78, s * 0.18, 0, 2 * P); ctx.stroke(); ctx.restore();
  },
  gassho(ctx, s) { ctx.beginPath(); ctx.moveTo(-s * 0.95, s * 0.35); ctx.lineTo(0, -s * 0.95); ctx.lineTo(s * 0.95, s * 0.35); ctx.closePath(); ctx.rect(-s * 0.7, s * 0.3, s * 1.4, s * 0.6); ctx.fill(); },
  cedar(ctx, s) { ctx.beginPath(); for (let i = 0; i < 4; i++) { const y = -s + i * s * 0.42, w = s * (0.3 + i * 0.17); ctx.moveTo(0, y); ctx.lineTo(w, y + s * 0.55); ctx.lineTo(-w, y + s * 0.55); ctx.closePath(); } ctx.rect(-s * 0.08, s * 0.7, s * 0.16, s * 0.3); ctx.fill(); },
  hydrangea(ctx, s) { ctx.beginPath(); for (let i = 0; i < 13; i++) { const a = i * 2.4, r = s * 0.62 * Math.sqrt(i / 13); const x = Math.cos(a) * r, y = Math.sin(a) * r; for (let k = 0; k < 4; k++) { const b = (k * P) / 2 + a; ctx.moveTo(x, y); ctx.ellipse(x + Math.cos(b) * s * 0.11, y + Math.sin(b) * s * 0.11, s * 0.12, s * 0.08, b, 0, 2 * P); } } ctx.fill(); },
  moon(ctx, s) { ctx.beginPath(); ctx.arc(0, 0, s, P * 0.35, P * 1.65); ctx.arc(s * 0.38, -s * 0.05, s * 0.78, P * 1.6, P * 0.42, true); ctx.closePath(); ctx.fill(); },
  onsen(ctx, s) {
    ctx.beginPath(); ctx.ellipse(0, s * 0.45, s * 0.85, s * 0.42, 0, 0, 2 * P); ctx.fill();
    ctx.save(); ctx.strokeStyle = ctx.fillStyle; ctx.lineCap = "round"; ctx.lineWidth = s * 0.13; ctx.beginPath();
    for (const x of [-0.42, 0, 0.42]) { ctx.moveTo(s * x, s * 0.05); ctx.bezierCurveTo(s * (x - 0.22), -s * 0.2, s * (x + 0.22), -s * 0.45, s * x, -s * 0.85); }
    ctx.stroke(); ctx.restore();
  },
};
function motif(ctx, name, x, y, s, rot = 0, paint) { ctx.save(); ctx.translate(x, y); ctx.rotate(rot); MOTIF[name](ctx, s, paint); ctx.restore(); }
/** Raised motif on a height map with a cast groove around it (reads as relief even when small). */
function relief(h, name, x, y, s, rot, top) {
  const g = (v) => `rgb(${v},${v},${v})`;
  h.save(); h.filter = "blur(3px)"; h.fillStyle = g(55); motif(h, name, x, y, s * 1.05, rot, { roof: g(55) }); h.restore();
  h.fillStyle = g(top); motif(h, name, x, y, s, rot, { roof: g(Math.min(255, top + 15)) });
}

/* ───────────── manhole cover ───────────── */
function manhole() {
  const N = 1024, C = N / 2, R = 500, INNER = 418;
  const [hc, h] = canvas(N, N);   // height (grey = height)
  const [cc, c] = canvas(N, N);   // paint colour
  const g = (v) => `rgb(${v},${v},${v})`;
  const p = D.paint;

  // ring: raised rim with diagonal anti-slip ribs
  h.fillStyle = g(0); h.fillRect(0, 0, N, N);
  h.fillStyle = g(150); h.beginPath(); h.arc(C, C, R, 0, 2 * P); h.fill();
  h.save(); h.beginPath(); h.arc(C, C, R - 8, 0, 2 * P); h.arc(C, C, INNER + 10, 0, 2 * P, true); h.clip();
  h.strokeStyle = g(205); h.lineWidth = 7;
  for (let a = 0; a < 2 * P; a += P / 90) { h.beginPath(); h.moveTo(C + Math.cos(a) * (INNER + 8), C + Math.sin(a) * (INNER + 8)); h.lineTo(C + Math.cos(a + 0.05) * R, C + Math.sin(a + 0.05) * R); h.stroke(); }
  h.restore();
  // a smooth band for the lettering
  for (const [a0, a1] of [[-P * 0.82, -P * 0.18], [P * 0.3, P * 0.7]]) { h.strokeStyle = g(150); h.lineWidth = 64; h.beginPath(); h.arc(C, C, (R + INNER) / 2, a0, a1); h.stroke(); }
  h.strokeStyle = g(220); h.lineWidth = 10; h.beginPath(); h.arc(C, C, INNER + 6, 0, 2 * P); h.stroke(); h.beginPath(); h.arc(C, C, R - 6, 0, 2 * P); h.stroke();

  function arcText(ctx, text, r, mid, size, bottom) {
    ctx.save(); ctx.font = `800 ${size}px ${MINCHO}`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    const step = (size * 1.05) / r, n = [...text].length;
    [...text].forEach((ch, i) => {
      const a = mid + (bottom ? -1 : 1) * (i - (n - 1) / 2) * step;
      ctx.save(); ctx.translate(C + Math.cos(a) * r, C + Math.sin(a) * r); ctx.rotate(a + (bottom ? -P / 2 : P / 2)); ctx.fillText(ch, 0, 0); ctx.restore();
    });
    ctx.restore();
  }
  h.fillStyle = g(235);
  arcText(h, D.ja, (R + INNER) / 2, -P / 2, D.ja.length > 4 ? 40 : 48, false);
  arcText(h, "おすい", (R + INNER) / 2, P / 2, 44, true);

  // inner disc background + pattern
  h.fillStyle = g(95); h.beginPath(); h.arc(C, C, INNER, 0, 2 * P); h.fill();
  c.fillStyle = p.bg; c.beginPath(); c.arc(C, C, INNER, 0, 2 * P); c.fill();
  h.save(); h.beginPath(); h.arc(C, C, INNER - 4, 0, 2 * P); h.clip();
  h.fillStyle = g(150); h.strokeStyle = g(150);
  if (D.bgPattern === "seigaiha") {
    h.lineWidth = 7;

  camera.position.set(0, 3.7, 1.75); camera.lookAt(0, 0, 0.04);

  const key = new THREE.DirectionalLight(0xfff0dc, 3.2); key.position.set(-3.4, 1.7, -1.6); key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048); Object.assign(key.shadow.camera, { left: -1.3, right: 1.3, top: 1.3, bottom: -1.3 }); key.shadow.bias = -0.0004;

/* ───────────── omamori ───────────── */

  // fabric + weave
  c.fillStyle = D.fabric; c.fillRect(0, 0, TW, TH);
  h.fillStyle = g(110); h.fillRect(0, 0, TW, TH);
  m.fillStyle = g(0); m.fillRect(0, 0, TW, TH);
  const cd = c.getImageData(0, 0, TW, TH), hd = h.getImageData(0, 0, TW, TH);
  for (let y = 0; y < TH; y++) for (let x = 0; x < TW; x++) {
    const i = (y * TW + x) * 4, weave = ((x >> 1) + (y >> 1)) % 2 ? 1 : -1, n = (rand() - 0.5) * 14;
    for (let k = 0; k < 3; k++) cd.data[i + k] = Math.max(0, Math.min(255, cd.data[i + k] + weave * 6 + n));
    hd.data[i] = hd.data[i + 1] = hd.data[i + 2] = 110 + weave * 14 + n;
  }

    ctx.save(); ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 3.2; ctx.globalAlpha = ctx === c ? 0.55 : 1;
    const t = D.pattern;
    if (t === "seigaiha") { for (let y = 0; y < TH + 40; y += 30) for (let x = (y / 30) % 2 ? 30 : 0; x < TW + 60; x += 60) for (const r of [27, 19, 11]) { ctx.beginPath(); ctx.arc(x, y, r, P, 2 * P); ctx.stroke(); } }
    else if (t === "asanoha") { const s = 48; for (let y = 0; y < TH + s; y += s * 0.866) for (let x = ((y / (s * 0.866)) % 2 ? s / 2 : 0); x < TW + s; x += s) { for (let k = 0; k < 6; k++) { const a = (k * P) / 3 + P / 6; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.cos(a) * s * 0.577, y + Math.sin(a) * s * 0.577); ctx.stroke(); } } }
    else if (t === "kikko") { const s = 34; for (let y = 0; y < TH + s * 2; y += s * 1.732) for (let x = 0; x < TW + s * 3; x += s * 3) for (const [ox, oy] of [[0, 0], [s * 1.5, s * 0.866]]) { ctx.beginPath(); for (let k = 0; k <= 6; k++) { const a = (k * P) / 3; ctx.lineTo(x + ox + Math.cos(a) * s * 0.92, y + oy + Math.sin(a) * s * 0.92); } ctx.stroke(); } }

  const loop = new THREE.CatmullRomCurve3([[-0.07, 0.72, 0], [-0.1, 0.95, 0.01], [-0.06, 1.28, 0.02], [0.0, 1.36, 0.02], [0.06, 1.28, 0.02], [0.1, 0.95, 0.01], [0.07, 0.72, 0]].map((v) => new THREE.Vector3(...v)));
  const cordLoop = new THREE.Mesh(new THREE.TubeGeometry(loop, 120, 0.022, 14, false), cordMat); cordLoop.castShadow = true;

  camera.position.set(0, 0.32, 5.4); camera.lookAt(0, 0.28, 0);
